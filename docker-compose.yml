version: "3.3"
services:
    php:
        build:
            args:
                user: usuario
                uid: 1001
            context: ./docker/php/
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        networks:
            - master_network

    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - 8002:80
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
        networks:
            - master_network

    mysql:
        image: mysql:8
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: master_veiculos
            MYSQL_ROOT_PASSWORD: 'root'
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            - 3309:3306
        networks:
            - master_network

networks:
    master_network:
        driver: bridge
